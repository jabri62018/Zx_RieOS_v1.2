<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sindbad Yemen - Research</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: "Tajawal", Tahoma, Arial, sans-serif;
  background: #fff;
  color: #000;
  margin: 0;
  padding: 20px;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  font-size: 28px;
  margin-bottom: 5px;
}

.sub {
  font-size: 18px;
  color: #555;
  margin-bottom: 15px;
}

.bird-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  margin: 15px 0;
  border: 3px solid #000;
  transition: transform 0.6s ease-in-out;
  animation: pulse 2s infinite ease-in-out;
}

/* نبض الطير حسب مقاس الشاشة */
@keyframes pulse {
 0%, 100% { transform: scale(1); }
 50% { transform: scale(var(--scale, 1.15)); }
}

.bar-menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 20px auto;
  max-width: 400px;
}

.bar-menu button, .bar-menu a {
  width: 100%;
  padding: 14px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: block;
  box-sizing: border-box;
  line-height: 1.4;
}

.bar-menu button:hover, .bar-menu a:hover {
  background: #333;
}

.bar-menu button.exit {
  background: #c62828;
}

.en-text {display: block; font-size: 16px;}
.ar-text {display: block; font-size: 14px; opacity: 0.85; margin-top: 3px;}

.row-btn {
  display: flex;
  gap: 10px;
}

.row-btn a {
  flex: 1;
}

.section {
  display: none;
  text-align: right;
  background: #f5f5f5;
  padding: 15px;
  border-radius: 12px;
  margin: 15px auto;
  max-width: 400px;
}

.section.active {
  display: block;
}

.section h3 {
  margin-top: 0;
  text-align: center;
}

.section a {
  display: block;
  color: #0066cc;
  text-decoration: none;
  margin: 6px 0;
  word-break: break-all;
}
</style>
<script>
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function pulseBird() {
  const bird = document.querySelector('.bird-img');
  if(!bird) return;
  const width = window.innerWidth;
  
  let scale = 1.1;
  if (width < 400) scale = 1.25;
  else if (width < 768) scale = 1.18;
  else scale = 1.12;
  
  bird.style.setProperty('--scale', scale);
}

window.onload = function() {
  document.getElementById('time').innerText = new Date().toLocaleTimeString('ar-SA');
  document.getElementById('date').innerText = new Date().toLocaleDateString('ar-SA');
  pulseBird();
};

window.onresize = pulseBird;
</script>
</head>
<body>

<h1>Sindbad Yemen <br> سندباد اليمن</h1>
<div class="sub">Eng. Abdulla Al-Jabri <br> م/ عبدالله الجبري</div>
<img src="Yemen_bird.png" alt="Yemen Bird" class="bird-img">

<!-- كمل باقي الأزرار والـ sections حقك هنا -->

</body>
</html>
